services:
  moneygraph:
    build: .
    environment:
      MONEY_GRAPH_AUTH: ${MONEY_GRAPH_AUTH:-local}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      MONEY_GRAPH_ALLOWED_EMAILS: ${MONEY_GRAPH_ALLOWED_EMAILS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      QADAM_ALLOW_EXTERNAL_AI: ${QADAM_ALLOW_EXTERNAL_AI:-false}
    ports:
      - "127.0.0.1:8504:8501"
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
      - moneygraph-state:/state
    restart: unless-stopped

volumes:
  moneygraph-state:
